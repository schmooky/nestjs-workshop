<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Burst Client</title>
    <link rel="stylesheet" href="./src/style.css">
  </head>
  <body>
    <div id="app">
      <header>
        <h1>Burst Client</h1>
        <div id="connection-status" class="disconnected">Disconnected</div>
      </header>

      <div class="container">
        <div class="controls">
          <button id="connect-btn" class="primary">Connect</button>
          <button id="session-btn" class="primary" disabled>Request Session</button>
          <button id="spin-btn" class="primary" disabled>Spin</button>
          <select id="bet-select" disabled>
            <option value="0.1">0.10</option>
            <option value="0.2">0.20</option>
            <option value="0.5">0.50</option>
            <option value="1" selected>1.00</option>
            <option value="2">2.00</option>
            <option value="5">5.00</option>
            <option value="10">10.00</option>
            <option value="20">20.00</option>
            <option value="50">50.00</option>
            <option value="100">100.00</option>
          </select>
        </div>

        <div class="game-info">
          <div class="info-item">
            <span class="label">Session ID:</span>
            <span id="session-id" class="value">-</span>
          </div>
          <div class="info-item">
            <span class="label">Balance:</span>
            <span id="balance" class="value">-</span>
          </div>
          <div class="info-item">
            <span class="label">Last Win:</span>
            <span id="win" class="value">-</span>
          </div>
        </div>

        <div class="game-board">
          <div id="reels-container">
            <!-- Reels will be populated dynamically -->
          </div>
        </div>

        <div class="log-container">
          <h3>Event Log</h3>
          <div id="log-messages"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
